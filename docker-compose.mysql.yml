# ─── Kamus Banjar API — Production with built-in MySQL (with shared Traefik) ──
#
# Requires the shared Traefik instance to be running first:
#   cd traefik/ && docker compose up -d
#
# Setup:
#   1. Copy .env.mysql.example → .env.mysql and fill in all values.
#   2. docker compose -f docker-compose.mysql.yml --env-file .env.mysql up -d
#
# On first startup MySQL will automatically run (in order):
#   database/migrations/001_schema.sql  — creates words/letters tables
#   database/seeds/002_seed.sql         — inserts all dictionary data
#   database/migrations/003_refresh_tokens.sql — refresh token table
#   database/migrations/004_word_source.sql    — word source/status columns
#   database/migrations/005_contributions.sql  — contribution workflow tables
#   database/migrations/006_community.sql      — votes, comments, bookmarks, wotd
#
# Subsequent restarts skip the init scripts because the data volume already exists.
# To re-seed from scratch: docker compose -f docker-compose.mysql.yml down -v
#
# The `traefik_public` network is created and owned by traefik/docker-compose.yml.
# This compose only declares it as external — it never creates or destroys it.

x-restart: &restart
  restart: unless-stopped

services:

  # ─── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    <<: *restart
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kamusbanjar}
      MYSQL_USER: ${MYSQL_USER:-kamus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Init scripts run in sorted order on first startup only.
      - ./database/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seeds/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./database/migrations/003_refresh_tokens.sql:/docker-entrypoint-initdb.d/003_refresh_tokens.sql:ro
      - ./database/migrations/004_word_source.sql:/docker-entrypoint-initdb.d/004_word_source.sql:ro
      - ./database/migrations/005_contributions.sql:/docker-entrypoint-initdb.d/005_contributions.sql:ro
      - ./database/migrations/006_community.sql:/docker-entrypoint-initdb.d/006_community.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${MYSQL_USER:-kamus}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *restart
    environment:
      PORT: ":8001"
      MYSQL_DSN: "${MYSQL_USER:-kamus}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-kamusbanjar}?parseTime=true&charset=utf8mb4"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-168h}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    networks:
      - traefik_public
      - backend_net
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"

      # Tell Traefik which network to use when this container is on multiple networks
      - "traefik.docker.network=traefik_public"

      # ── Router ────────────────────────────────────────────────────────────────
      - "traefik.http.routers.kamus-banjar-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.kamus-banjar-api.entrypoints=websecure"
      - "traefik.http.routers.kamus-banjar-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kamus-banjar-api.service=kamus-banjar-api-svc"
      - "traefik.http.routers.kamus-banjar-api.middlewares=security-headers@docker"

      # ── Service ───────────────────────────────────────────────────────────────
      - "traefik.http.services.kamus-banjar-api-svc.loadbalancer.server.port=8001"

volumes:
  mysql_data:

networks:
  # Shared public network — created by traefik/docker-compose.yml, NOT here.
  traefik_public:
    external: true

  # Private network for MySQL — never exposed to Traefik.
  backend_net:
    internal: true
